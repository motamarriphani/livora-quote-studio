name: Deploy frontend (Cloudflare Pages)

# Needs two repo secrets: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Only the staged browser files in public/ are uploaded.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-accounts-livora
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/stage-public.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name accounts-livora --branch main
