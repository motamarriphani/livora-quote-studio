name: Deploy frontend (Cloudflare Pages)

# Runs on every push to main. Needs repo secrets CLOUDFLARE_API_TOKEN
# (permission: Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional repo variables (Settings → Variables): CLERK_PUBLISHABLE_KEY and
# CONVEX_URL — set them to the production values; when unset the build
# falls back to the development values baked into web/src/main.tsx.
# Only the Vite build output (web/dist) is uploaded — never the repo root.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-accounts-livora
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name accounts-livora --branch main
